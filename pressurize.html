<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRESSURIZE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Press Start 2P', monospace; }
  canvas { display: block; image-rendering: pixelated; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 480, H = 640;
canvas.width = W; canvas.height = H;

function resize(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.width=(W*s)+'px'; canvas.style.height=(H*s)+'px';
}
resize(); window.addEventListener('resize',resize);

// Audio
let audioCtx;
function initAudio(){ if(audioCtx) return; audioCtx=new(window.AudioContext||window.webkitAudioContext)(); }
function playTone(freq,dur,type,vol){
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.connect(g);g.connect(audioCtx.destination);
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.1,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.start();o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}
function sfxCollect(){ playTone(880,0.1,'sine',0.12);setTimeout(()=>playTone(1100,0.1,'sine',0.1),70); }
function sfxHit(){ playTone(120,0.25,'sawtooth',0.18); }
function sfxDie(){ playTone(80,1.0,'sawtooth',0.25); }
function sfxRussHit(){ playTone(300,0.08,'square',0.15);playTone(180,0.12,'sawtooth',0.1); }
function sfxRussDie(){ playTone(200,0.2,'square',0.18);setTimeout(()=>playTone(80,0.6,'sawtooth',0.2),200); }
function sfxTorp(){ playTone(400,0.05,'square',0.08);setTimeout(()=>playTone(180,0.1,'sawtooth',0.12),50); }
function sfxBlast(){ playTone(90,0.4,'sawtooth',0.22); }
let ambN,ambG;
function startAmbient(){
  if(!audioCtx||ambN) return;
  ambN=audioCtx.createOscillator();ambG=audioCtx.createGain();
  ambN.connect(ambG);ambG.connect(audioCtx.destination);
  ambN.type='sine';ambN.frequency.value=55;ambG.gain.value=0.04;ambN.start();
}
function updAmbient(d){ if(!ambG) return; const i=Math.min(d/1000,1);ambG.gain.value=0.04+i*0.06;ambN.frequency.value=55-i*20; }

// State
let state='title',keys={},score=0,depth=0,maxDepth=0,ox=100,hull=100,frameCount=0;
let deathReason='',scrollY=0,generatedZones=0;
const BASE_SCROLL=0.6;
let sub={x:W/2,y:H*0.35,vx:0,vy:0,w:28,h:16,facing:1,dFlash:0};
let treasures=[],airPockets=[],enemies=[],particles=[],rocks=[],bgRocks=[];
let torpedoes=[],obstacles=[],clickFx=[];

function rand(a,b){return a+Math.random()*(b-a);}
function randInt(a,b){return Math.floor(rand(a,b));}

// Canvas click pos with scale
function cpos(cx,cy){
  const r=canvas.getBoundingClientRect();
  return{x:(cx-r.left)*(W/r.width),y:(cy-r.top)*(H/r.height)};
}

canvas.addEventListener('mousedown',e=>{
  initAudio();
  if(state==='title'){state='playing';initGame();return;}
  if(state==='dead'||state==='win'){state='title';return;}
  onClick(cpos(e.clientX,e.clientY));
});
let tStart=null;
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  const p=cpos(e.touches[0].clientX,e.touches[0].clientY);
  if(state==='title'){state='playing';initGame();return;}
  if(state==='dead'||state==='win'){state='title';return;}
  onClick(p);tStart=p;
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(!tStart) return;
  const p=cpos(e.touches[0].clientX,e.touches[0].clientY);
  keys['ArrowLeft']=p.x-tStart.x<-18;keys['ArrowRight']=p.x-tStart.x>18;
  keys['ArrowUp']=p.y-tStart.y<-18;keys['ArrowDown']=p.y-tStart.y>18;
},{passive:false});
canvas.addEventListener('touchend',()=>{
  tStart=null;keys['ArrowLeft']=keys['ArrowRight']=keys['ArrowUp']=keys['ArrowDown']=false;
});
window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='Space'||e.code==='Enter'){
    initAudio();
    if(state==='title'){state='playing';initGame();}
    else if(state==='dead'||state==='win') state='title';
    e.preventDefault();
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup',e=>keys[e.code]=false);

function onClick(p){
  // Try hit Russian subs
  for(const e of enemies){
    if(!e.alive||e.type!==4) continue;
    const sy=w2s(e.wy);
    if(Math.abs(p.x-e.x)<e.w/2+10&&Math.abs(p.y-sy)<e.h/2+10){
      e.hp--;e.flash=12;sfxRussHit();
      for(let i=0;i<3;i++) spawnFx(e.x,sy,'dmg');
      clickFx.push({x:p.x,y:p.y,life:25,max:25});
      if(e.hp<=0){
        e.alive=false;score+=300;ox=Math.min(100,ox+30);sfxRussDie();
        for(let i=0;i<8;i++) spawnFx(e.x,sy,'gold');
        airPockets.push({x:e.x,wy:e.wy-25,r:18,pulse:0,collected:false});
      }
      return;
    }
  }
  // Squid click
  for(const e of enemies){
    if(!e.alive||e.type!==3) continue;
    const sy=w2s(e.wy);
    if(Math.abs(p.x-e.x)<e.w/2+6&&Math.abs(p.y-sy)<e.h/2+10){
      e.hp--;e.flash=8;
      for(let i=0;i<4;i++) spawnFx(e.x,sy,'dmg');
      clickFx.push({x:p.x,y:p.y,life:15,max:15});
      if(e.hp<=0){ e.alive=false;score+=80;for(let i=0;i<10;i++) spawnFx(e.x,sy,'gold'); }
      return;
    }
  }
  for(let i=0;i<3;i++) spawnFx(p.x,p.y,'bubble');
  clickFx.push({x:p.x,y:p.y,life:15,max:15});
}

function w2s(wy){return wy+scrollY+H;}

function rectsOvl(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function circRect(cx,cy,cr,rx,ry,rw,rh){
  const nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  return(cx-nx)**2+(cy-ny)**2<cr*cr;
}

function initGame(){
  sub={x:W/2,y:H*0.35,vx:0,vy:0,w:28,h:16,facing:1,dFlash:0};
  scrollY=0;depth=0;maxDepth=0;score=0;ox=100;hull=100;frameCount=0;
  generatedZones=0;deathReason='';
  treasures=[];airPockets=[];enemies=[];particles=[];rocks=[];bgRocks=[];
  torpedoes=[];obstacles=[];clickFx=[];
  for(let i=0;i<6;i++) genZone(i);
  generatedZones=6;
  addBubbles();startAmbient();
}

const ZH=300;

function genZone(zi){
  const yB=zi*ZH, d=Math.min(zi*0.12, 6.0);
  // Treasure — scales steadily all the way to zone ~333 (10,000m)
  // Min climbs from 4 to ~37, max climbs from 12 to ~66 at 10000m
  const coinMin = 4 + Math.floor(zi/10);
  const coinMax = 12 + Math.floor(zi/5);
  const coinCount = randInt(coinMin, coinMax);
  // Value multiplier: 1x at surface, up to 35x at 10000m
  const coinVal = 1 + Math.floor(zi / 5);
  // Spread coins across full zone height plus a bonus spread that grows with depth
  const coinSpread = ZH * (1.0 + Math.min(zi * 0.05, 2.0));
  for(let i=0;i<coinCount;i++)
    treasures.push({
      x: rand(18, W-18),
      wy: yB - rand(10, coinSpread),
      w: 18, h: 14,
      value: randInt(10, 50) * coinVal,
      glow: rand(0, Math.PI*2),
      col: false
    });
  // Rocks
  for(let i=0;i<randInt(2,5);i++){
    const s=Math.random()<0.5;
    rocks.push({x:s?rand(0,W*0.25):rand(W*0.75,W),wy:yB-rand(0,ZH),w:rand(30,80),h:rand(20,50)});
  }
  for(let i=0;i<3;i++) bgRocks.push({x:rand(0,W),wy:yB-rand(0,ZH),w:rand(60,160),h:rand(30,90),a:rand(0.05,0.15)});  // Air pockets: more abundant AND spread across wider world-height the deeper the zone
  const airCount = randInt(3 + Math.floor(zi/2), 8 + zi);
  const airSpread = ZH * (1.5 + Math.min(zi * 0.09, 3.0));
  for(let i=0;i<airCount;i++){
    airPockets.push({
      x: rand(18, W-18),
      wy: yB - rand(8, airSpread),
      r: rand(14, 30 + Math.min(zi*1.5, 24)),
      pulse: rand(0, Math.PI*2),
      collected: false
    });
  }

  // OBSTACLES — present every zone, scaling with depth
  for(let i=0;i<randInt(2,5+Math.floor(zi/10));i++)
    obstacles.push({type:'mine',x:rand(30,W-30),wy:yB-rand(10,ZH-10),r:9,pulse:rand(0,Math.PI*2),trg:false,tTimer:0,dead:false});
  for(let i=0;i<randInt(2,4+Math.floor(zi/8));i++)
    obstacles.push({type:'vent',x:rand(25,W-25),wy:yB-rand(0,ZH),r:rand(16,28),pulse:rand(0,Math.PI*2),dead:false,ink:false,life:999});
  for(let i=0;i<randInt(1,3+Math.floor(zi/15));i++){
    const side=Math.random()<0.5;
    obstacles.push({type:'crack',x:side?rand(0,W*0.3):rand(W*0.7,W),wy:yB-rand(0,ZH),w:rand(22,52),h:rand(8,20),phase:rand(0,Math.PI*2),dead:false});
  }

  // Enemies — scale steadily all the way to zone 333 (~10000m)
  for(let i=0;i<randInt(1,3+Math.floor(zi/12));i++) enemies.push(mkEnemy(0,zi,yB));  // mini Russian subs
  if(zi>=1) for(let i=0;i<randInt(0,1+Math.floor(zi/18));i++) enemies.push(mkEnemy(1,zi,yB));
  if(zi>=1) for(let i=0;i<randInt(0,2+Math.floor(zi/20));i++) enemies.push(mkEnemy(2,zi,yB));
  for(let i=0;i<randInt(1,2+Math.floor(zi/12));i++) enemies.push(mkEnemy(3,zi,yB));
  for(let i=0;i<randInt(1,2+Math.floor(zi/8));i++) enemies.push(mkEnemy(4,zi,yB));

  // Rocks
  for(let i=0;i<randInt(2,5);i++){
    const s=Math.random()<0.5;
    rocks.push({x:s?rand(0,W*0.25):rand(W*0.75,W),wy:yB-rand(0,ZH),w:rand(30,80),h:rand(20,50)});
  }
  for(let i=0;i<3;i++) bgRocks.push({x:rand(0,W),wy:yB-rand(0,ZH),w:rand(60,160),h:rand(30,90),a:rand(0.05,0.15)});
}

function mkEnemy(type,zi,yB){
  const spd=0.4+Math.min(zi*0.04,3.0)*0.5;
  const e={type,alive:true,x:rand(40,W-40),wy:yB-rand(20,ZH-20),
    vx:(Math.random()<0.5?1:-1)*rand(spd*0.5,spd),vy:0,phase:rand(0,Math.PI*2),flash:0};
  if(type===0){e.w=26;e.h=12;}  // mini Russian sub dimensions
  else if(type===1){e.w=22;e.h=16;e.aggro=130;}
  else if(type===2){e.w=44;e.h=12;}
  else if(type===3){e.w=20;e.h=24;e.hp=3;e.inkT=0;e.inkCD=100+randInt(0,80);}
  else if(type===4){e.w=48;e.h=18;e.hp=4+Math.floor(zi/5)+1;e.maxHp=4+Math.floor(zi/5)+1;e.tTimer=randInt(40,100);e.tCD=Math.max(50,randInt(80,160)-zi);e.facing=1;}
  return e;
}

function addBubbles(){
  for(let i=0;i<50;i++)
    particles.push({type:'bubble',x:rand(0,W),wy:-rand(0,H*3),r:rand(1,4),speed:rand(0.3,1.0),alpha:rand(0.2,0.5),wob:rand(0,Math.PI*2)});
}

function spawnFx(x,y,t){
  if(t==='gold') particles.push({type:'fx',x,y,vx:rand(-2,2),vy:rand(-3,-0.5),life:35,max:35,alpha:1,col:'#FFD700'});
  else if(t==='dmg') particles.push({type:'fx',x,y,vx:rand(-2,2),vy:rand(-2,1),life:22,max:22,alpha:1,col:'#FF3300'});
  else particles.push({type:'fx',x,y,vx:rand(-1,1),vy:rand(-2,0),life:25,max:25,alpha:1,col:'rgba(100,200,255,0.8)'});
}

function die(r){hull=0;state='dead';deathReason=r;sfxDie();if(ambG) ambG.gain.value=0;}

function update(){
  if(state!=='playing') return;
  frameCount++;
  const currentScroll = BASE_SCROLL + Math.min(depth * 0.00055, 6.0);
  scrollY -= currentScroll;
  depth=Math.floor(-scrollY/10);
  if(depth>maxDepth) maxDepth=depth;
  const zn=Math.ceil((depth*10+H*2)/ZH)+2;
  while(generatedZones<zn){genZone(generatedZones);generatedZones++;addBubbles();}

  // Movement
  const sp=2.2,dr=0.85;
  if(keys['ArrowLeft']||keys['KeyA']){sub.vx-=sp*0.18;sub.facing=-1;}
  if(keys['ArrowRight']||keys['KeyD']){sub.vx+=sp*0.18;sub.facing=1;}
  if(keys['ArrowUp']||keys['KeyW']) sub.vy-=sp*0.18;
  if(keys['ArrowDown']||keys['KeyS']) sub.vy+=sp*0.18;
  sub.vx*=dr;sub.vy*=dr;
  sub.vx=Math.max(-sp,Math.min(sp,sub.vx));sub.vy=Math.max(-sp,Math.min(sp,sub.vy));
  sub.x+=sub.vx;sub.y+=sub.vy;
  sub.x=Math.max(sub.w/2,Math.min(W-sub.w/2,sub.x));
  sub.y=Math.max(sub.h/2,Math.min(H-sub.h/2,sub.y));
  if(sub.dFlash>0) sub.dFlash--;

  // Oxygen drain — lasts ~5min at surface, gentle depth penalty
  const zone=Math.floor(depth/30);
  ox-=0.0056+zone*0.000015;
  if(ox<=0){ox=0;hull-=0.06;if(hull<=0) die('Drowned');}

  // Win - resurface
  if(sub.y<H*0.15&&depth<5){score+=Math.floor(maxDepth*2);state='win';sfxCollect();return;}
  // Reach 10,000m
  if(depth>=10000){score+=50000;state='win';sfxCollect();sfxCollect();return;}

  // --- Obstacles ---
  for(const ob of obstacles){
    if(ob.dead) continue;
    const sy=w2s(ob.wy);
    if(sy<-80||sy>H+80) continue;
    ob.pulse=(ob.pulse||0)+0.04;
    if(ob.type==='mine'){
      if(circRect(sub.x,sub.y,ob.r+6,sub.x-sub.w/2,sub.y-sub.h/2,sub.w,sub.h)){
        if(!ob.trg){ob.trg=true;ob.tTimer=28;}
      }
      if(ob.trg){
        ob.tTimer--;
        if(ob.tTimer<=0){
          hull-=8;sub.dFlash=50;sfxBlast();
          for(let i=0;i<5;i++) spawnFx(ob.x,sy,'dmg');
          ob.dead=true;
        }
      }
    } else if(ob.type==='vent'){
      if(ob.ink){ob.life--;if(ob.life<=0){ob.dead=true;continue;}}
      if(sub.dFlash===0&&circRect(sub.x,sub.y,ob.r,sub.x-sub.w/2,sub.y-sub.h/2,sub.w,sub.h)){
        ox-=ob.ink?0.15:0.07;
        if(frameCount%70===0) playTone(200,0.2,'sine',0.05);
        if(ox<=0){ox=0;hull-=0.04;}
      }
    } else if(ob.type==='crack'){
      if(sub.dFlash===0&&rectsOvl(sub.x-sub.w/2,sub.y-sub.h/2,sub.w,sub.h,ob.x,sy,ob.w,ob.h)){
        hull-=0.5;sub.dFlash=14;sfxHit();for(let i=0;i<4;i++) spawnFx(sub.x,sub.y,'dmg');
      }
    }
    if(hull<=0) die('Crushed by pressure');
  }
  obstacles=obstacles.filter(o=>!o.dead);

  // --- Torpedoes ---
  for(const t of torpedoes){
    t.x+=t.vx;t.y+=t.vy;t.life--;
    if(sub.dFlash===0&&rectsOvl(t.x-8,t.y-4,16,8,sub.x-sub.w/2,sub.y-sub.h/2,sub.w,sub.h)){
      hull-=8;sub.dFlash=55;sfxBlast();for(let i=0;i<5;i++) spawnFx(t.x,t.y,'dmg');t.life=0;
      if(hull<=0) die('Hit by torpedo');
    }
  }
  torpedoes=torpedoes.filter(t=>t.life>0&&t.x>-30&&t.x<W+30&&t.y>-30&&t.y<H+100);

  // --- Enemies ---
  for(const e of enemies){
    if(!e.alive) continue;
    if(e.flash>0) e.flash--;
    e.phase+=0.03;
    const sy=w2s(e.wy);
    const dx=sub.x-e.x,dy=sub.y-sy,dist=Math.sqrt(dx*dx+dy*dy)||1;

    if(e.type===0){ // Jellyfish
      e.x+=e.vx+Math.sin(e.phase)*0.3;e.wy+=Math.sin(e.phase*0.7)*0.15;
      if(e.x<10||e.x>W-10) e.vx*=-1;
    } else if(e.type===1){ // Anglerfish
      if(dist<(e.aggro||130)){e.x+=dx/dist*1.2;e.wy-=dy/dist*1.2;}
      else{e.x+=e.vx;if(e.x<20||e.x>W-20) e.vx*=-1;}
    } else if(e.type===2){ // Eel
      e.x+=e.vx+Math.sin(e.phase)*0.5;if(e.x<20||e.x>W-20) e.vx*=-1;
    } else if(e.type===3){ // Squid
      e.inkT++;
      if(dist<110){
        e.x+=dx/dist*0.9;e.wy-=dy/dist*0.9;
        if(e.inkT>=e.inkCD){
          e.inkT=0;
          // Ink cloud at player position
          obstacles.push({type:'vent',x:sub.x+rand(-20,20),wy:(sub.y-H)-scrollY,r:rand(22,34),pulse:0,dead:false,ink:true,life:160});
          playTone(160,0.2,'sine',0.08);
        }
      } else {
        e.x+=e.vx+Math.sin(e.phase*1.3)*0.5;e.wy+=Math.cos(e.phase)*0.3;
        if(e.x<15||e.x>W-15) e.vx*=-1;
      }
    } else if(e.type===4){ // Russian Sub
      e.x+=dx/dist*0.65;e.wy-=dy/dist*0.65;
      e.facing=dx>0?1:-1;
      e.x=Math.max(e.w/2+5,Math.min(W-e.w/2-5,e.x));
      e.tTimer--;
      if(e.tTimer<=0){
        e.tTimer=e.tCD;
        fireTorp(e.x,w2s(e.wy),sub.x,sub.y);sfxTorp();
      }
    }

    // Contact damage
    const esy=w2s(e.wy);
    if(e.type!==4){
      if(sub.dFlash===0&&rectsOvl(sub.x-sub.w/2,sub.y-sub.h/2,sub.w,sub.h,e.x-e.w/2,esy-e.h/2,e.w,e.h)){
        const dmg=e.type===1?3:e.type===2?2:e.type===3?2:1;
        hull-=dmg;sub.dFlash=40;sfxHit();for(let i=0;i<6;i++) spawnFx(sub.x,sub.y,'dmg');
        if(hull<=0) die('Killed by '+['jellyfish','anglerfish','eel','squid'][e.type]);
      }
    } else {
      if(sub.dFlash===0&&rectsOvl(sub.x-sub.w/2,sub.y-sub.h/2,sub.w,sub.h,e.x-e.w/2,esy-e.h/2,e.w,e.h)){
        hull-=4;sub.dFlash=50;sfxHit();for(let i=0;i<8;i++) spawnFx(sub.x,sub.y,'dmg');
        if(hull<=0) die('Rammed by Russian sub');
      }
    }
  }

  // Treasures
  for(const t of treasures){
    if(t.col) continue; t.glow+=0.05;
    const sy=w2s(t.wy);
    if(rectsOvl(sub.x-sub.w/2,sub.y-sub.h/2,sub.w,sub.h,t.x-t.w/2,sy-t.h/2,t.w,t.h)){
      t.col=true;score+=t.value;sfxCollect();for(let i=0;i<8;i++) spawnFx(t.x,sy,'gold');
    }
  }
  // Air pockets
  for(const a of airPockets){
    if(a.collected) continue; a.pulse+=0.05;
    const sy=w2s(a.wy);
    if(circRect(a.x,sy,a.r,sub.x-sub.w/2,sub.y-sub.h/2,sub.w,sub.h)){
      a.collected=true;ox=Math.min(100,ox+(a.r<20?8.3:25));playTone(440,0.3,'sine',0.15);
      for(let i=0;i<12;i++) spawnFx(a.x,sy,'bubble');
    }
  }
  // Rocks
  for(const r of rocks){
    const sy=w2s(r.wy);
    if(rectsOvl(sub.x-sub.w/2,sub.y-sub.h/2,sub.w,sub.h,r.x,sy,r.w,r.h)){
      hull-=0.25;sub.dFlash=10;if(sub.facing>0) sub.vx=-2;else sub.vx=2;
      if(hull<=0) die('Crushed by rocks');
    }
  }

  // Particles
  for(const p of particles){
    if(p.type==='bubble'){
      p.wy-=p.speed;p.wob+=0.05;p.x+=Math.sin(p.wob)*0.3;
      if(w2s(p.wy)<-20){p.wy=-scrollY+H+rand(0,80);p.x=rand(0,W);}
    } else {p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--;p.alpha=p.life/p.max;}
  }
  particles=particles.filter(p=>p.type==='bubble'||p.life>0);
  clickFx=clickFx.filter(h=>(h.life--)>0);
  updAmbient(depth);
}

function fireTorp(fx,fy,tx,ty){
  const dx=tx-fx,dy=ty-fy,d=Math.sqrt(dx*dx+dy*dy)||1,sp=3.5;
  torpedoes.push({x:fx,y:fy,vx:dx/d*sp,vy:dy/d*sp,life:130});
}

// Draw helpers
function zbg(d){const t=Math.min(d/800,1);return `rgb(${0},${Math.floor(20-t*18)},${Math.floor(60-t*45)})`;}

function drawBG(){
  ctx.fillStyle=zbg(depth);ctx.fillRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(0,20,60,0.4)');g.addColorStop(1,'rgba(0,0,10,0.6)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const r of bgRocks){
    const sy=w2s(r.wy)*0.7+H*0.3;
    if(sy<-r.h||sy>H+r.h) continue;
    ctx.fillStyle=`rgba(0,10,30,${r.a})`;
    ctx.beginPath();ctx.ellipse(r.x,sy,r.w/2,r.h/2,0,0,Math.PI*2);ctx.fill();
  }
}

function drawRocks(){
  for(const r of rocks){
    const sy=w2s(r.wy);if(sy<-r.h||sy>H+r.h) continue;
    ctx.fillStyle='#0a0f1a';ctx.strokeStyle='#1a2a40';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(r.x,sy+r.h);ctx.lineTo(r.x+r.w*0.1,sy+r.h*0.4);
    ctx.lineTo(r.x+r.w*0.25,sy);ctx.lineTo(r.x+r.w*0.5,sy+r.h*0.2);
    ctx.lineTo(r.x+r.w*0.75,sy-r.h*0.05);ctx.lineTo(r.x+r.w,sy+r.h*0.3);
    ctx.lineTo(r.x+r.w,sy+r.h);ctx.closePath();ctx.fill();ctx.stroke();
  }
}

function drawObstacles(){
  for(const ob of obstacles){
    if(ob.dead) continue;
    const sy=w2s(ob.wy);if(sy<-80||sy>H+80) continue;
    ctx.save();
    if(ob.type==='mine'){
      const g=(Math.sin(ob.pulse)+1)/2;
      const c=ob.trg?'#FF0000':'#FF8800';
      ctx.shadowColor=c;ctx.shadowBlur=10+g*14;
      ctx.fillStyle=c;ctx.beginPath();ctx.arc(ob.x,sy,ob.r,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ob.x,sy,ob.r-3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=c;ctx.lineWidth=2;
      for(let i=0;i<8;i++){
        const a=i/8*Math.PI*2;
        ctx.beginPath();ctx.moveTo(ob.x+Math.cos(a)*ob.r,sy+Math.sin(a)*ob.r);
        ctx.lineTo(ob.x+Math.cos(a)*(ob.r+5),sy+Math.sin(a)*(ob.r+5));ctx.stroke();
      }
      ctx.fillStyle='rgba(255,200,0,0.8)';ctx.font='4px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('MINE',ob.x,sy+ob.r+8);
      if(ob.trg&&Math.floor(frameCount/4)%2===0){
        ctx.fillStyle='rgba(255,30,0,0.35)';ctx.beginPath();ctx.arc(ob.x,sy,ob.r+12,0,Math.PI*2);ctx.fill();
      }
    } else if(ob.type==='vent'){
      const lp=ob.ink?(ob.life/160):1;
      const gc=ob.ink?'#880099':'#00FF66',fc=ob.ink?`rgba(30,0,60,`:`rgba(0,180,50,`;
      ctx.shadowColor=gc;ctx.shadowBlur=16;
      ctx.fillStyle=fc+(0.15*lp)+')';
      ctx.beginPath();ctx.arc(ob.x,sy,ob.r+(Math.sin(ob.pulse)*3),0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=fc+(0.35*lp)+')';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(ob.x,sy,ob.r,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=ob.ink?`rgba(200,100,255,${0.8*lp})`:`rgba(80,255,120,0.8)`;
      ctx.font='5px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(ob.ink?'INK':'VENT',ob.x,sy);
    } else if(ob.type==='crack'){
      ob.phase+=0.02;
      ctx.shadowColor='#FF4400';ctx.shadowBlur=8+Math.sin(ob.phase)*4;
      ctx.fillStyle='rgba(200,50,0,0.75)';ctx.fillRect(ob.x,sy,ob.w,ob.h);
      ctx.strokeStyle='rgba(255,120,0,0.9)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(ob.x,sy+ob.h/2);
      for(let i=1;i<6;i++) ctx.lineTo(ob.x+ob.w*i/6,sy+(i%2===0?0:ob.h));
      ctx.stroke();
      ctx.fillStyle='rgba(255,100,0,0.7)';ctx.font='4px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='bottom';
      ctx.fillText('CRACK',ob.x+ob.w/2,sy-2);
    }
    ctx.restore();
  }
}

function drawTreasures(){
  for(const t of treasures){
    if(t.col) continue; const sy=w2s(t.wy);if(sy<-20||sy>H+20) continue;
    const g=(Math.sin(t.glow)+1)/2;
    ctx.save();ctx.shadowColor='#FFD700';ctx.shadowBlur=8+g*12;
    ctx.fillStyle='#8B4513';ctx.fillRect(t.x-t.w/2,sy-t.h/2,t.w,t.h);
    ctx.fillStyle='#A0522D';ctx.fillRect(t.x-t.w/2,sy-t.h/2,t.w,t.h*0.45);
    ctx.fillStyle='#FFD700';ctx.fillRect(t.x-3,sy-3,6,6);ctx.restore();
    ctx.fillStyle='rgba(255,215,0,0.7)';ctx.font='5px "Press Start 2P"';ctx.textAlign='center';
    ctx.fillText('+'+t.value,t.x,sy-t.h/2-4);
  }
}

function drawAir(){
  for(const a of airPockets){
    if(a.collected) continue; const sy=w2s(a.wy);if(sy<-30||sy>H+30) continue;
    const p=(Math.sin(a.pulse)+1)/2;
    ctx.save();ctx.shadowColor='#00FFFF';ctx.shadowBlur=10+p*15;
    ctx.strokeStyle=`rgba(100,220,255,${0.5+p*0.3})`;ctx.lineWidth=2;
    ctx.fillStyle=`rgba(0,180,220,${0.12+p*0.08})`;
    ctx.beginPath();ctx.arc(a.x,sy,a.r+p*2,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle=`rgba(150,240,255,${0.6+p*0.3})`;
    ctx.font='7px "Press Start 2P"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('O₂',a.x,sy);ctx.restore();
  }
}

function drawStar(cx,cy,R,r,pts){
  ctx.beginPath();
  for(let i=0;i<pts*2;i++){
    const rad=i%2===0?R:r,a=(i/pts)*Math.PI-Math.PI/2;
    i===0?ctx.moveTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad):ctx.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad);
  }
  ctx.closePath();ctx.fill();
}

function drawEnemies(){
  for(const e of enemies){
    if(!e.alive) continue;
    const sy=w2s(e.wy);if(sy<-60||sy>H+60) continue;
    ctx.save();
    if(e.flash>0&&Math.floor(e.flash/3)%2===0) ctx.globalAlpha=0.25;
    if(e.type===0){ // Mini Russian Sub (formerly jellyfish)
      ctx.shadowColor='#AA0000';ctx.shadowBlur=10+Math.sin(e.phase)*4;
      ctx.save();ctx.translate(e.x,sy);ctx.scale(e.vx>=0?1:-1,1);
      // Hull
      ctx.fillStyle='#2a0000';
      ctx.beginPath();ctx.ellipse(0,0,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();
      // Red stripe
      ctx.fillStyle='#880000';ctx.fillRect(-e.w/2+3,-2,e.w-6,4);
      // Conning tower
      ctx.fillStyle='#1a0000';ctx.fillRect(-3,-e.h/2-5,7,7);
      // Periscope
      ctx.strokeStyle='#CC0000';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(2,-e.h/2-5);ctx.lineTo(2,-e.h/2-9);ctx.lineTo(5,-e.h/2-9);ctx.stroke();
      // Red star
      ctx.fillStyle='#FF2200';
      ctx.beginPath();
      for(let i=0;i<10;i++){const r2=i%2===0?5:2.5,a2=i/5*Math.PI-Math.PI/2;i===0?ctx.moveTo(Math.cos(a2)*r2,Math.sin(a2)*r2-1):ctx.lineTo(Math.cos(a2)*r2,Math.sin(a2)*r2-1);}
      ctx.closePath();ctx.fill();
      // Propeller bubbles
      ctx.fillStyle='rgba(255,80,80,0.3)';
      ctx.beginPath();ctx.arc(-e.w/2-3,0,2+Math.random()*2,0,Math.PI*2);ctx.fill();
      ctx.restore();
    } else if(e.type===1){ // Anglerfish
      ctx.shadowColor='#FF4400';ctx.shadowBlur=16;
      ctx.fillStyle='#1a0a00';ctx.beginPath();ctx.ellipse(e.x,sy,15,10,0,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#FF8800';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(e.x,sy-10);ctx.lineTo(e.x+5,sy-18);ctx.stroke();
      ctx.fillStyle='#FFAA00';ctx.shadowColor='#FFAA00';ctx.shadowBlur=8;ctx.beginPath();ctx.arc(e.x+5,sy-18,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FF2200';ctx.beginPath();ctx.arc(e.x+8,sy-3,3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FFF';ctx.fillRect(e.x-8,sy+6,3,4);ctx.fillRect(e.x-3,sy+7,3,3);ctx.fillRect(e.x+2,sy+6,3,4);
    } else if(e.type===2){ // Eel
      ctx.shadowColor='#00FF88';ctx.shadowBlur=10;
      ctx.strokeStyle='#003322';ctx.lineWidth=8;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(e.x-e.w/2,sy);ctx.quadraticCurveTo(e.x,sy+Math.sin(e.phase)*8,e.x+e.w/2,sy);ctx.stroke();
      ctx.strokeStyle='#00CC66';ctx.lineWidth=5;
      ctx.beginPath();ctx.moveTo(e.x-e.w/2,sy);ctx.quadraticCurveTo(e.x,sy+Math.sin(e.phase)*8,e.x+e.w/2,sy);ctx.stroke();
    } else if(e.type===3){ // Squid
      ctx.shadowColor='#AA00FF';ctx.shadowBlur=14;
      ctx.fillStyle='rgba(80,0,120,0.85)';ctx.beginPath();ctx.ellipse(e.x,sy-6,8,13,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(100,10,150,0.9)';ctx.beginPath();ctx.ellipse(e.x,sy+6,10,8,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FF88FF';ctx.shadowColor='#FF00FF';ctx.shadowBlur=5;
      ctx.beginPath();ctx.arc(e.x-4,sy+4,3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(e.x+4,sy+4,3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='rgba(130,0,180,0.7)';ctx.lineWidth=2;
      for(let i=0;i<8;i++){
        const a=(i/8)*Math.PI+Math.PI*0.1,tx=e.x+Math.cos(a)*10;
        ctx.beginPath();ctx.moveTo(tx,sy+10);
        ctx.quadraticCurveTo(tx+Math.sin(e.phase+i)*5,sy+18,tx+Math.sin(e.phase+i)*3,sy+24+Math.sin(e.phase+i*1.2)*4);
        ctx.stroke();
      }
      ctx.fillStyle='rgba(90,0,130,0.6)';
      ctx.beginPath();ctx.ellipse(e.x-10,sy-5,5,8,0.4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(e.x+10,sy-5,5,8,-0.4,0,Math.PI*2);ctx.fill();
      // HP pips
      ctx.restore();ctx.save();
      for(let i=0;i<3;i++){
        ctx.fillStyle=i<e.hp?'#AA00FF':'#330033';
        ctx.beginPath();ctx.arc(e.x-6+i*6,sy-e.h/2-10,4,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle='rgba(200,100,255,0.6)';ctx.font='4px "Press Start 2P"';ctx.textAlign='center';
      ctx.fillText('CLICK',e.x,sy-e.h/2-18);
    } else if(e.type===4){ // Russian Sub
      // HP bar
      ctx.restore();ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(e.x-e.w/2,sy-e.h/2-12,e.w,7);
      ctx.fillStyle='#DD0000';ctx.fillRect(e.x-e.w/2,sy-e.h/2-12,e.w*(e.hp/e.maxHp),7);
      ctx.strokeStyle='rgba(255,50,0,0.5)';ctx.lineWidth=1;ctx.strokeRect(e.x-e.w/2,sy-e.h/2-12,e.w,7);
      ctx.fillStyle='rgba(255,200,0,0.85)';ctx.font='4px "Press Start 2P"';ctx.textAlign='center';
      ctx.fillText('☭ CLICK x'+e.hp,e.x,sy-e.h/2-16);
      ctx.translate(e.x,sy);ctx.scale(e.facing,1);
      ctx.shadowColor='#CC0000';ctx.shadowBlur=16+Math.sin(frameCount*0.05)*6;
      ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(0,0,e.w/2,e.h/2,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#CC0000';drawStar(0,-1,6,3,5);
      ctx.fillStyle='#111';ctx.fillRect(-6,-e.h/2-8,12,10);
      ctx.fillStyle='#CC0000';ctx.fillRect(-e.w/2+4,-2,e.w-8,4);
      ctx.fillStyle='#FFCC00';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('☭',0,0);
      ctx.fillStyle='#555';ctx.fillRect(e.w/2-2,-3,10,6);
    }
    ctx.restore();
  }
}

function drawTorps(){
  for(const t of torpedoes){
    ctx.save();ctx.shadowColor='#FF8800';ctx.shadowBlur=14;
    const ang=Math.atan2(t.vy,t.vx);
    ctx.translate(t.x,t.y);ctx.rotate(ang);
    ctx.fillStyle='#FFAA00';ctx.fillRect(-10,-3,20,6);
    ctx.fillStyle='#FF4400';ctx.beginPath();ctx.moveTo(10,-3);ctx.lineTo(16,0);ctx.lineTo(10,3);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,80,0,0.25)';ctx.fillRect(-22,-2,12,4);
    ctx.restore();
  }
}

function drawSub(){
  ctx.save();ctx.translate(sub.x,sub.y);ctx.scale(sub.facing,1);
  if(sub.dFlash>0&&Math.floor(sub.dFlash/4)%2===0) ctx.globalAlpha=0.35;
  if(Math.abs(sub.vx)>0.1||Math.abs(sub.vy)>0.1){
    ctx.fillStyle='rgba(150,220,255,0.3)';ctx.beginPath();ctx.arc(-sub.w/2-4,0,3+Math.random()*2,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowColor='#00AAFF';ctx.shadowBlur=8;
  ctx.fillStyle='#1a3a5c';ctx.beginPath();ctx.ellipse(0,0,sub.w/2,sub.h/2,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2a5a8c';ctx.fillRect(-sub.w/2+4,-2,sub.w-8,4);
  ctx.fillStyle='#1a3a5c';ctx.fillRect(-4,-sub.h/2-6,8,8);
  ctx.strokeStyle='#3a7aac';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(2,-sub.h/2-6);ctx.lineTo(2,-sub.h/2-10);ctx.lineTo(6,-sub.h/2-10);ctx.stroke();
  ctx.fillStyle='rgba(100,200,255,0.65)';ctx.shadowColor='#00FFFF';ctx.shadowBlur=5;
  ctx.beginPath();ctx.arc(4,0,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2a5a8c';ctx.beginPath();ctx.moveTo(sub.w/2,0);ctx.lineTo(sub.w/2+8,-3);ctx.lineTo(sub.w/2+8,3);ctx.closePath();ctx.fill();
  ctx.restore();
}

function drawParticles(){
  for(const p of particles){
    ctx.save();ctx.globalAlpha=p.alpha;
    if(p.type==='bubble'){
      const sy=w2s(p.wy);ctx.strokeStyle='rgba(150,220,255,0.6)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(p.x,sy,p.r,0,Math.PI*2);ctx.stroke();
    } else {
      ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,2,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
  for(const h of clickFx){
    const a=h.life/h.max;ctx.save();ctx.globalAlpha=a;
    ctx.strokeStyle=`rgba(255,50,50,${a})`;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(h.x,h.y,(1-a)*28+4,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=`rgba(255,220,0,${a})`;ctx.font='8px "Press Start 2P"';ctx.textAlign='center';
    ctx.fillText('HIT!',h.x,h.y-14*(1-a)-8);ctx.restore();
  }
}

function drawHUD(){
  const zones=['SURFACE ZONE','TWILIGHT ZONE','MIDNIGHT ZONE','ABYSSAL ZONE','HADAL ZONE','ULTRA-DEEP','CHALLENGER DEEP','THE VOID','DARK ABYSS','NO RETURN'];
  const zone=Math.floor(depth/1000);
  ctx.fillStyle='rgba(0,10,30,0.8)';ctx.fillRect(0,0,W,58);
  ctx.strokeStyle='rgba(0,100,200,0.4)';ctx.lineWidth=1;ctx.strokeRect(0,0,W,58);
  const bW=140;
  ctx.fillStyle='rgba(0,20,50,0.8)';ctx.fillRect(10,8,bW,14);
  ctx.fillStyle=ox>50?'#00AAFF':ox>25?'#FFAA00':'#FF3300';
  if(ox>0) ctx.fillRect(11,9,(bW-2)*(ox/100),12);
  ctx.strokeStyle='rgba(0,150,255,0.5)';ctx.lineWidth=1;ctx.strokeRect(10,8,bW,14);
  ctx.fillStyle='#88CCFF';ctx.font='5px "Press Start 2P"';ctx.textAlign='left';ctx.fillText('O₂ '+Math.floor(ox)+'%',12,20);
  ctx.fillStyle='rgba(0,20,50,0.8)';ctx.fillRect(10,26,bW,14);
  ctx.fillStyle=hull>50?'#00FF88':hull>25?'#FFAA00':'#FF3300';
  if(hull>0) ctx.fillRect(11,27,(bW-2)*(hull/100),12);
  ctx.strokeStyle='rgba(0,255,100,0.4)';ctx.lineWidth=1;ctx.strokeRect(10,26,bW,14);
  ctx.fillStyle='#88FFBB';ctx.fillText('HULL '+Math.floor(hull)+'%',12,38);
  ctx.textAlign='right';ctx.fillStyle='#AADDFF';ctx.font='6px "Press Start 2P"';ctx.fillText(depth+'m',W-10,20);
  ctx.fillStyle='rgba(100,180,255,0.6)';ctx.font='4px "Press Start 2P"';ctx.fillText(zones[Math.min(zone,zones.length-1)],W-10,30);
  ctx.fillStyle='rgba(100,200,255,0.45)';ctx.fillText('MAX '+maxDepth+'m',W-10,42);
  // Sink speed warning
  const spd2=BASE_SCROLL+Math.min(depth*0.00055,6.0);
  const spdCol=spd2>2?'#FF4400':spd2>1.5?'#FFAA00':'#88CCFF';
  ctx.fillStyle=spdCol;ctx.fillText('SINK '+(spd2).toFixed(1)+'x',W-10,52);
  ctx.textAlign='center';ctx.fillStyle='#FFD700';ctx.font='7px "Press Start 2P"';ctx.fillText(score,W/2,20);
  ctx.fillStyle='rgba(255,215,0,0.5)';ctx.font='4px "Press Start 2P"';ctx.fillText('SCORE',W/2,30);
  // Side meter
  const mX=W-14,mY=70,mH=200;
  ctx.fillStyle='rgba(0,10,30,0.6)';ctx.fillRect(mX,mY,10,mH);
  const sp2=Math.min((sub.y-60)/(H-100),1);
  ctx.fillStyle='#00AAFF';ctx.fillRect(mX+2,mY+sp2*(mH-8),6,8);
  // Hull vignette
  if(hull/100<0.4){
    const v=(0.4-hull/100)/0.4,vg=ctx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.7);
    vg.addColorStop(0,'rgba(200,0,0,0)');vg.addColorStop(1,`rgba(200,0,0,${v*0.5})`);
    ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
    if(Math.floor(frameCount/15)%2===0){ctx.strokeStyle=`rgba(255,0,0,${v*0.6})`;ctx.lineWidth=4;ctx.strokeRect(2,2,W-4,H-4);}
  }
  if(ox<20&&Math.floor(frameCount/20)%2===0){ctx.fillStyle='rgba(0,80,200,0.1)';ctx.fillRect(0,0,W,H);}
  // Bottom legend
  ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(0,H-20,W,20);
  ctx.font='4px "Press Start 2P"';ctx.textAlign='left';
  ctx.fillStyle='#FF8800';ctx.fillText('⬡MINE',4,H-7);
  ctx.fillStyle='#00FF66';ctx.fillText('●VENT=O₂',56,H-7);
  ctx.fillStyle='#FF4400';ctx.fillText('▬CRACK',128,H-7);
  ctx.fillStyle='#AA00FF';ctx.fillText('✦SQUID',188,H-7);
  ctx.fillStyle='#FF0000';ctx.fillText('☭RUSSIAN',248,H-7);
  ctx.fillStyle='#FFDD00';ctx.fillText('→CLICK TO KILL +300pts +O₂',326,H-7);
}

function drawTitle(){
  ctx.fillStyle='#000810';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(0,80,160,0.28)';
  for(let i=0;i<25;i++){ctx.beginPath();ctx.arc((Math.sin(frameCount*0.01+i*1.3)*0.5+0.5)*W,(frameCount*0.3+i*33)%H,2+i%4,0,Math.PI*2);ctx.fill();}
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(0,60,120,0.55)');g.addColorStop(1,'rgba(0,0,20,0.8)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='#00AAFF';ctx.shadowBlur=30;ctx.fillStyle='#00DDFF';ctx.font='26px "Press Start 2P"';ctx.textAlign='center';
  ctx.fillText('PRESSURIZE',W/2,H*0.19);ctx.restore();
  ctx.fillStyle='#FFF';ctx.font='8px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('PRESSURIZE',W/2,H*0.19);
  ctx.fillStyle='rgba(100,200,255,0.8)';ctx.font='4px "Press Start 2P"';ctx.fillText('DEEP SEA SURVIVAL',W/2,H*0.26);

  const yg=H*0.31;
  ctx.fillStyle='rgba(0,8,24,0.72)';ctx.fillRect(16,yg-6,W-32,120);
  ctx.strokeStyle='rgba(0,100,200,0.35)';ctx.lineWidth=1;ctx.strokeRect(16,yg-6,W-32,120);
  ctx.fillStyle='rgba(100,200,255,0.9)';ctx.font='5px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('— THREATS —',W/2,yg+8);
  const lines=[
    {c:'#AA2222',t:'MINI RUSSIAN SUB — rams hull'},
    {c:'#FF4400',t:'ANGLERFISH  —  chases & bites'},
    {c:'#00FF88',t:'EEL  —  patrols & strikes'},
    {c:'#AA00FF',t:'SQUID  —  shoots INK (drains O₂)'},
    {c:'#FF3300',t:'☭ RUSSIAN SUB — FIRES TORPEDOES'},
    {c:'#FFDD00',t:'  CLICK IT TO DESTROY  +300 +O₂'},
    {c:'#FF8800',t:'MINES  •  ACID VENTS  •  PRESSURE CRACKS'},
  ];
  lines.forEach((l,i)=>{ctx.fillStyle=l.c;ctx.font='4px "Press Start 2P"';ctx.textAlign='left';ctx.fillText(l.t,24,yg+22+i*12);});

  ctx.font='5px "Press Start 2P"';ctx.fillStyle='rgba(200,240,255,0.8)';ctx.textAlign='center';
  ctx.fillText('WASD / ARROWS to pilot',W/2,H*0.78);
  ctx.fillText('CLICK enemies to attack',W/2,H*0.84);
  if(Math.floor(frameCount/30)%2===0){ctx.fillStyle='#00FFFF';ctx.font='6px "Press Start 2P"';ctx.fillText('CLICK or SPACE TO DIVE',W/2,H*0.92);}
}

function drawDead(){
  ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='#FF2200';ctx.shadowBlur=25;ctx.fillStyle='#FF4400';ctx.font='16px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('IMPLODED',W/2,H*0.28);ctx.restore();
  ctx.fillStyle='rgba(255,150,100,0.9)';ctx.font='5px "Press Start 2P"';ctx.textAlign='center';ctx.fillText(deathReason.toUpperCase(),W/2,H*0.37);
  ctx.fillStyle='#FFD700';ctx.font='7px "Press Start 2P"';ctx.fillText('SCORE: '+score,W/2,H*0.5);
  ctx.fillStyle='#88CCFF';ctx.fillText('MAX DEPTH: '+maxDepth+'m',W/2,H*0.59);
  if(Math.floor(frameCount/30)%2===0){ctx.fillStyle='#AADDFF';ctx.font='5px "Press Start 2P"';ctx.fillText('CLICK OR SPACE TO RETRY',W/2,H*0.74);}
}

function drawWin(){
  ctx.fillStyle='rgba(0,5,20,0.92)';ctx.fillRect(0,0,W,H);
  const reached10k=maxDepth>=10000;
  ctx.save();ctx.shadowColor=reached10k?'#FFD700':'#00FFAA';ctx.shadowBlur=28;
  ctx.fillStyle=reached10k?'#FFD700':'#00FFAA';ctx.font=reached10k?'10px "Press Start 2P"':'14px "Press Start 2P"';ctx.textAlign='center';
  ctx.fillText(reached10k?'10,000M REACHED!':'SURFACED!',W/2,H*0.26);ctx.restore();
  if(reached10k){ctx.fillStyle='rgba(255,220,0,0.7)';ctx.font='5px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('+50,000 BONUS POINTS',W/2,H*0.34);}
  ctx.fillStyle='#FFD700';ctx.font='7px "Press Start 2P"';ctx.textAlign='center';ctx.fillText('FINAL SCORE: '+score,W/2,H*0.43);
  ctx.fillStyle='#88CCFF';ctx.fillText('MAX DEPTH: '+maxDepth+'m',W/2,H*0.53);
  ctx.fillStyle='rgba(100,255,180,0.8)';ctx.font='5px "Press Start 2P"';
  ctx.fillText(reached10k?'YOU REACHED THE BOTTOM!':'YOU MADE IT BACK ALIVE',W/2,H*0.62);
  if(Math.floor(frameCount/30)%2===0){ctx.fillStyle='#AADDFF';ctx.font='5px "Press Start 2P"';ctx.fillText('CLICK OR SPACE TO PLAY AGAIN',W/2,H*0.76);}
}

function loop(){
  frameCount++;update();ctx.clearRect(0,0,W,H);
  if(state==='title') drawTitle();
  else if(state==='playing'){drawBG();drawRocks();drawObstacles();drawTreasures();drawAir();drawEnemies();drawTorps();drawParticles();drawSub();drawHUD();}
  else if(state==='dead'){drawBG();drawDead();}
  else if(state==='win'){drawBG();drawWin();}
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
